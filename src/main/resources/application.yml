spring:
  application:
    name: assignment

  profiles:
    default: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://sopt-39-sungbeen.p-e.kr}

# Base64로 인코딩한 32바이트 이상의 비밀키를 환경변수로 주입
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000 # 30분 (ms)
